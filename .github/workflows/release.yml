name: Release

# Publishes to PyPI when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI trusted publishing, so no API token is stored in this repository.
# One-time setup on pypi.org, under "Publishing" (as a pending publisher
# before the first upload, or in the project's settings afterwards):
#   owner: Boredem125, repository: piiredact,
#   workflow: release.yml, environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # A published version can never be replaced, so refuse a tag that
      # does not match the version in the code.
      - name: Tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/piiredact-${version}-py3-none-any.whl"
          test -f "dist/piiredact-${version}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
