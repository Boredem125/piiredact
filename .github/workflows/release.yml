name: Release

# Publishes to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing, so no API token is stored in this repository.
# One-time setup on pypi.org, under "Publishing" for the project (or as a
# pending publisher before the first upload):
#   owner: Boredem125, repository: piiredact,
#   workflow: release.yml, environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
